# yamllint rules for Chart.yaml and values*.yaml (templates are Go templates, not linted here).
extends: default
rules:
  line-length: {max: 120, allow-non-breakable-words: true}
  document-start: disable
  truthy: {allowed-values: ["true", "false"]}
  comments: {min-spaces-from-content: 1}
  comments-indentation: disable
  braces: {max-spaces-inside: 0}
  indentation: {spaces: 2, indent-sequences: consistent}
