name: ci

# Static checks: shell lint, chart validation, secret scan. The job that installs the chart on a
# kind cluster and runs a smoke and load test is added in step 8.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tests/*.sh

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # chart-testing compares against the target branch
      - uses: azure/setup-helm@v4
      - uses: helm/chart-testing-action@v2  # installs ct, yamllint and yamale
      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: helm lint and kubeconform, every values overlay
        run: scripts/chart-validate.sh
      - name: chart-testing lint
        run: ct lint --all --config ct.yaml

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan the whole history, not just the last commit
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
