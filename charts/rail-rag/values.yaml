# Defaults are the safe local ones: fake generator, no API key needed.
# Overlays: values-dev.yaml (2 replicas) and values-ci.yaml (1 replica, small).

nameOverride: ""
fullnameOverride: ""

# Loaded into kind with `kind load docker-image`; never pulled from a registry.
image:
  repository: rail-rag-k8s
  tag: dev
  pullPolicy: IfNotPresent

api:
  replicas: 2
  port: 7860
  # Empty = the image's own command.
  command: []
  # Each pod is a fixed unit of capacity: 1 CPU requested and allowed (D17). Without a CPU limit
  # one pod used 2.4 cores of the 8-core VM and never saturated, so adding pods added nothing.
  # Memory measured in D15: 233 MiB idle, 247 MiB peak; the limit is about twice that.
  resources:
    requests: {cpu: "1", memory: 320Mi}
    limits: {cpu: "1", memory: 512Mi}
  # ONNX Runtime threads for the query embedding. Matches the CPU limit, so the runtime is not
  # throttled by starting one thread per node core (8). 0 = the runtime's default.
  embedThreads: 1
  # Probes, and why they differ (docs/DESIGN.md, D5):
  #   startup   - may take minutes: model loaded, Qdrant reachable, index complete.
  #   readiness - local state only; must NOT depend on Qdrant (shared by every pod).
  #   liveness  - the process answers; nothing else, so a slow dependency never restarts pods.
  probes:
    # 180 x 5 s = 15 min, the index Job's own deadline (index.activeDeadlineSeconds). On a fresh
    # cluster the api waits for the index; with 5 min the pods were killed once while it built
    # (9 min on a busy host). Liveness only starts after this succeeds, so the budget is safe.
    startup: {path: /startupz, periodSeconds: 5, failureThreshold: 180, timeoutSeconds: 3}
    readiness: {path: /readyz, periodSeconds: 5, failureThreshold: 2, timeoutSeconds: 2}
    liveness: {path: /livez, periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 3}
  # Shutdown order: preStop sleep (pod leaves the Service) -> SIGTERM -> in-flight requests drain.
  # The sleep plus the longest request must fit inside terminationGracePeriodSeconds.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30
  pdb:
    enabled: true
    maxUnavailable: 1
  # Spread pods across nodes so one node going away does not take every replica.
  topologySpread: true
  # Set by the autoscaler step; when enabled the Deployment stops managing `replicas`.
  autoscaling:
    enabled: false
    # hpa:  the built-in HorizontalPodAutoscaler on CPU only (needs metrics-server).
    # keda: a KEDA ScaledObject with two triggers, CPU and requests in flight per pod (needs KEDA
    #       and Prometheus). KEDA creates an ordinary HPA, which scales to the larger of the two.
    mode: hpa
    minReplicas: 2
    maxReplicas: 5
    cpuUtilization: 70          # percent of the CPU request, averaged over the pods
    inFlightPerPod: 4           # keda only: target average of rail_http_requests_in_flight
    prometheusUrl: http://kps-prometheus.monitoring.svc:9090
    # Scale up at once, scale down only after this long without the need for more pods: avoids
    # removing a pod between two bursts. The Kubernetes default is 300 s.
    scaleDownStabilizationSeconds: 120
  service:
    port: 80

generator:
  # fake: deterministic, seeded delay, no network. gemini: real, needs the Secret below.
  provider: fake
  fake:
    minLatencyMs: 300
    maxLatencyMs: 900
    seed: 0
  # Upstream retries can run for minutes; the wrapper stops waiting after this many seconds.
  timeoutSeconds: 20
  # Name of a Secret you create yourself (README). Optional: the fake generator needs none.
  existingSecret: rail-rag-secrets
  secretKey: GEMINI_API_KEY

# The upstream limiter allows 5 questions a minute per client IP, which a load test exceeds.
rateLimit:
  perMinute: 1000000
  perDay: 100000000

logLevel: info

qdrant:
  image: {repository: qdrant/qdrant, tag: v1.19.1}  # matches qdrant-client 1.19.1 pinned upstream
  # How long the api waits for Qdrant before answering 503. A Service with no ready pods makes
  # connections hang rather than fail (measured 10.7 s), so this is what makes the 503 fast.
  clientTimeoutSeconds: 2
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
  persistence:
    size: 1Gi
    storageClass: ""  # empty = the cluster default (kind: local-path, bound to one node)
  terminationGracePeriodSeconds: 30

# Builds the index into the Qdrant server once per image/corpus revision, then exits.
index:
  enabled: true
  command: ["python", "-m", "rail_k8s.index_job"]
  # Change to force a rebuild without changing the image tag.
  revision: "1"
  backoffLimit: 6
  activeDeadlineSeconds: 900
  resources:
    # Peak 667 MiB measured in the cluster at embedding batch 8 (D15).
    requests: {cpu: 250m, memory: 768Mi}
    limits: {memory: 1Gi}

networkPolicy:
  enabled: true
  # Who may call the api, besides pods in this namespace.
  apiIngressFromNamespaces: [monitoring]
  # The real generator is an external HTTPS API; the fake one needs no egress.
  allowPublicHttps: true

# Needs kube-prometheus-stack (scripts/install-monitoring.sh): these create its custom resources,
# so they stay off until its CRDs exist. values-dev.yaml turns them on.
observability:
  serviceMonitor:
    enabled: false
    interval: 15s
  alerts:
    enabled: false
    p95Seconds: 4        # /ask p95 above this for 5 minutes. The fake generator tops out near 2.7 s.
    errorRatio: 0.05     # share of /ask answered with 5xx over 5 minutes
  dashboard:
    enabled: false
