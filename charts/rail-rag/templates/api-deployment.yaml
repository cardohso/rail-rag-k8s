apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rail-rag.fullname" . }}-api
  labels:
    {{- include "rail-rag.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  # Add a new pod and wait for it to be ready before removing an old one: capacity never drops.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "rail-rag.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rail-rag.labels" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        # A config change rolls the pods; a ConfigMap edit alone would not restart anything.
        checksum/config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "rail-rag.podSecurityContext" . | nindent 8 }}
      {{- if .Values.api.topologySpread }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "rail-rag.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "rail-rag.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.api.command }}
          command: {{ toJson . }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "rail-rag.fullname" . }}-api
          {{- if .Values.generator.existingSecret }}
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.generator.existingSecret }}
                  key: {{ .Values.generator.secretKey }}
                  optional: true
          {{- end }}
          startupProbe:
            httpGet: {path: {{ .Values.api.probes.startup.path }}, port: http}
            periodSeconds: {{ .Values.api.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.api.probes.startup.timeoutSeconds }}
          readinessProbe:
            httpGet: {path: {{ .Values.api.probes.readiness.path }}, port: http}
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.api.probes.readiness.timeoutSeconds }}
          livenessProbe:
            httpGet: {path: {{ .Values.api.probes.liveness.path }}, port: http}
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.api.probes.liveness.timeoutSeconds }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.api.preStopSleepSeconds }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "rail-rag.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
