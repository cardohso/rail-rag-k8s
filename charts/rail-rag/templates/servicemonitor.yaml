{{- if .Values.observability.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rail-rag.fullname" . }}-api
  labels:
    {{- include "rail-rag.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "rail-rag.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.observability.serviceMonitor.interval }}
{{- end }}
