apiVersion: v1
kind: Service
metadata:
  name: {{ include "rail-rag.fullname" . }}-api
  labels:
    {{- include "rail-rag.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "rail-rag.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
